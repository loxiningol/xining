name: kimi-provider-failover

on:
  pull_request:
    branches: [main, master]
    paths:
      - "dual_engine_workflow_v2/kimi_provider.py"
      - "dual_engine_workflow_v2/creation_small_n_rigor.py"
      - "tests_workflow_v2/test_kimi_provider_failover.py"
      - "tests_workflow_v2/test_creation_small_n_rigor.py"
      - ".github/workflows/kimi-provider-failover.yml"
  push:
    branches: [main, master]
    paths:
      - "dual_engine_workflow_v2/kimi_provider.py"
      - "dual_engine_workflow_v2/creation_small_n_rigor.py"
      - "tests_workflow_v2/test_kimi_provider_failover.py"
      - "tests_workflow_v2/test_creation_small_n_rigor.py"
      - ".github/workflows/kimi-provider-failover.yml"
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile provider + small-n rigor
        run: |
          python -m py_compile dual_engine_workflow_v2/kimi_provider.py
          python -m py_compile dual_engine_workflow_v2/creation_small_n_rigor.py
      - name: Provider failover / invent-chain unit tests
        run: python -m unittest tests_workflow_v2.test_kimi_provider_failover -v
      - name: Creation small-n rigor unit tests
        run: python -m unittest tests_workflow_v2.test_creation_small_n_rigor -v
