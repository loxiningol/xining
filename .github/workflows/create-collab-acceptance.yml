name: create-collab-acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile provider
        run: python -m py_compile dual_engine_workflow_v2/kimi_provider.py
      - name: Provider failover unit tests
        run: python -m unittest tests_workflow_v2.test_kimi_provider_failover -v
