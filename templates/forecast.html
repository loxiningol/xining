<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系统规划预测 · 栖语</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7eef6;
      --muted: #8b9aab;
      --accent: #3d8bfd;
      --line: #2a3542;
      --ok: #3ecf8e;
      --warn: #f0b429;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "IBM Plex Sans", "PingFang SC", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a3d, var(--bg));
      color: var(--text); min-height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 28px; border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 10px 16px; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    a.link { color: var(--muted); text-decoration: none; font-size: 14px; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .metric {
      background: #121820; border-radius: 10px; padding: 14px;
      border: 1px solid var(--line);
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 28px; font-weight: 650; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .muted { color: var(--muted); }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 6px 0; }
    #status { font-size: 13px; color: var(--muted); }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>系统规划预测</h1>
      <div class="sub">统计基线 × regime 因子推演成交节奏；三AI仅解释，不作为次数来源</div>
    </div>
    <div class="actions">
      <a class="link" href="/">← 返回监控</a>
      <button id="btnRun" type="button" onclick="runForecast()">运行系统规划预测</button>
    </div>
  </header>
  <main>
    <div id="status">加载中…</div>
    <div id="calibBanner" class="card" style="display:none;border-color:#f0b429">
      <p id="calibBannerText" style="margin:0;color:var(--warn)"></p>
    </div>
    <div id="staleBanner" class="card" style="display:none;border-color:#e64646">
      <p id="staleBannerText" style="margin:0;color:#ff8a8a"></p>
    </div>
    <div class="card">
      <h2>总体预测</h2>
      <div class="grid">
        <div class="metric"><div class="label">预计日均成交(可成交)</div><div class="value" id="daily">暂无</div></div>
        <div class="metric"><div class="label">预计周总成交(可成交)</div><div class="value" id="weekly">暂无</div></div>
        <div class="metric"><div class="label">挂载策略</div><div class="value" id="activeN">暂无</div></div>
        <div class="metric"><div class="label">可开仓 / 暂停</div><div class="value" id="openPause">暂无</div></div>
      </div>
      <p class="muted" id="gapLine" style="margin-top:12px"></p>
      <p class="muted" id="posGapLine"></p>
      <p class="muted" id="portfolioLine"></p>
      <p class="muted" id="sourceLayerLine"></p>
      <p class="muted" id="familyLine"></p>
      <p class="muted" id="summary" style="margin-top:14px;white-space:pre-line"></p>
      <p class="muted" id="generated"></p>
    </div>
    <div class="card">
      <h2>分策略预测</h2>
      <table>
        <thead>
          <tr>
            <th>策略</th><th>标的/周期</th><th>等级</th><th>状态</th><th>机制家族</th>
            <th>来源层</th><th>周成交区间</th><th>漏斗(S/A/F)</th><th>近7日成交</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="8" class="muted">暂无数据</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>周校准（预测 vs 实现）</h2>
      <table>
        <thead><tr><th>预测时间</th><th>期望周成交</th><th>实现周成交</th><th>误差</th><th>方法</th></tr></thead>
        <tbody id="calib"><tr><td colspan="5" class="muted">暂无</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>关键假设</h2>
      <ul id="assumptions"></ul>
    </div>
    <div class="card">
      <h2>风险提示</h2>
      <ul id="risks"></ul>
    </div>
    <div class="card">
      <h2>历史记录</h2>
      <table>
        <thead><tr><th>时间</th><th>日均</th><th>周总</th><th>策略数</th><th>三AI(解释)</th></tr></thead>
        <tbody id="history"><tr><td colspan="5" class="muted">暂无</td></tr></tbody>
      </table>
    </div>
  </main>
  <script>
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function disp(v, fallback) {
      if (v === null || v === undefined || v === '') return fallback || '暂无样本/未校准';
      return v;
    }
    function renderLatest(rep) {
      if (!rep || !rep.generated_at) {
        document.getElementById('status').textContent = '尚无预测报告，可点击右上角立即运行。';
        return;
      }
      const stale = !!rep.stale || rep.is_current === false;
      const staleEl = document.getElementById('staleBanner');
      if (stale) {
        staleEl.style.display = 'block';
        document.getElementById('staleBannerText').textContent =
          rep.ui_stale_banner_zh ||
          ('预测已过期（策略池已变更）。生成时策略数=' +
           disp(rep.active_strategy_count) + '，当前池版本=' +
           disp(rep.strategy_pool_version_now || rep.strategy_pool_version) +
           '。请触发统计刷新，勿把旧预测当当前。');
        if (!rep.is_current) {
          document.getElementById('daily').textContent = '已过期';
          document.getElementById('weekly').textContent = '已过期';
        }
      } else {
        staleEl.style.display = 'none';
      }
      const stage = rep.calibration_stage || (rep.calibration || {}).calibration_stage || {};
      const calibEl = document.getElementById('calibBanner');
      if (stage.ui_must_show_calibration_banner || rep.calibration_banner_zh || (stage.complete_periods || 0) < 4) {
        calibEl.style.display = 'block';
        document.getElementById('calibBannerText').textContent =
          rep.calibration_banner_zh || stage.banner_zh ||
          '预测模型尚处于校准期，当前数值为统计估计，不代表已验证精度。';
      } else if (stage.stage) {
        calibEl.style.display = 'block';
        document.getElementById('calibBannerText').textContent =
          '校准阶段：' + stage.stage + '（完整周期 ' + disp(stage.complete_periods) + '）· ' +
          (stage.banner_zh || '');
      } else {
        calibEl.style.display = 'none';
      }
      const o = rep.overall || {};
      if (!stale || rep.is_current !== false) {
        document.getElementById('daily').textContent = disp(o.daily_opens_expected, '暂无');
        document.getElementById('weekly').textContent = disp(o.weekly_opens_expected, '暂无');
      }
      document.getElementById('activeN').textContent = disp(rep.active_strategy_count, '暂无');
      document.getElementById('openPause').textContent =
        disp(rep.can_open_strategy_count, '?') + ' / ' + disp(rep.paused_strategy_count, '?');
      const gap = rep.frequency_gap || {};
      document.getElementById('gapLine').textContent = gap.expected_daily_fills == null
        ? '频率缺口：暂无'
        : ('总频率缺口：日均 ' + gap.expected_daily_fills + '（目标0.5–1.0，gap=' + gap.gap_daily_to_band +
           '）· 周 ' + gap.expected_weekly_fills + '（目标3.5–7，gap=' + gap.gap_weekly_to_band +
           '）· 状态 ' + (gap.status || ''));
      const pos = rep.positive_expectancy_frequency || {};
      const peg = rep.positive_expectancy_frequency_gap || pos.positive_expectancy_frequency_gap || {};
      document.getElementById('posGapLine').textContent =
        '正期望频率：已校准正E周 ' + disp(pos.calibrated_positive_E_weekly, '0') +
        ' · 未校准 ' + disp(pos.uncalibrated_weekly != null ? pos.uncalibrated_weekly : pos.uncalibrated, '0') +
        ' · 近零E ' + disp(pos.near_zero_E_weekly != null ? pos.near_zero_E_weekly : pos.near_zero, '0') +
        ' · 负E ' + disp(pos.negative_E_weekly != null ? pos.negative_E_weekly : pos.negative, '0') +
        ' · 可成交总频率周 ' + disp(pos.total_fillable_weekly) +
        ' · 正E缺口周 ' + disp(peg.gap_weekly_to_band, '暂无');
      const pf = rep.portfolio_frequency || {};
      const boot = pf.bootstrap || {};
      document.getElementById('portfolioLine').textContent =
        '组合修正：简单相加周 ' + disp(pf.simple_sum_weekly) +
        ' · 相关修正(均值不变) ' + disp(pf.correlation_adjusted_weekly) +
        ' · 冲突修正/可成交 ' + disp(pf.final_fillable_weekly) +
        ' · 7d中位 ' + disp(boot.median_7d) +
        ' · P(3日无成交) ' + disp(boot.p_3day_no_fill) +
        ' · P(7日低于目标) ' + disp(boot.p_7day_below_target);
      const ecs = rep.event_coverage_matrix_summary || {};
      document.getElementById('sourceLayerLine').textContent =
        '事件漏斗：legacy仍主源=' + disp(ecs.legacy_still_primary, '?') +
        ' · 任一对满7日全税覆盖=' + disp(ecs.any_sufficient_7d_full_coverage, 'false') +
        ' · 规则：event_n>0 ≠ 7日基线；来源层=event/legacy/prior/uncalibrated';
      const fam = rep.mechanism_families || {};
      document.getElementById('familyLine').textContent =
        '机制家族独立位 ' + disp(fam.independent_niche_count, '?') +
        ' · 饱和 ' + ((fam.saturated || []).join(',') || '无') +
        ' · 方法 ' + (o.frequency_method || 'statistical') + '（AI=' + (o.ai_role || 'explain_only') + '）';
      const contrib = o.weekly_contributors_zh || '';
      const sum = o.summary_zh || '';
      document.getElementById('summary').textContent = contrib
        ? (contrib + (sum ? ('\n' + sum) : ''))
        : sum;
      document.getElementById('generated').textContent =
        '生成时间：' + (rep.generated_at || '') +
        ' · 策略池版本：' + disp(rep.strategy_pool_version || rep.strategy_pool_version_now) +
        (rep.refresh_mode ? (' · 模式：' + rep.refresh_mode) : '');
      const ai = rep.ai_status || {};
      document.getElementById('status').innerHTML =
        (stale ? '<span class="warn">STALE</span> · ' : '最新报告已加载 · ') +
        '三AI(解释-only)：' +
        '<span class="' + (ai.deepseek_ok ? 'ok' : 'warn') + '">DeepSeek</span> / ' +
        '<span class="' + (ai.qwen_ok ? 'ok' : 'warn') + '">Qwen</span> / ' +
        '<span class="' + (ai.chatgpt_ok ? 'ok' : 'warn') + '">GLM</span>';
      const body = (rep.per_strategy || []).map(r => {
        const f = r.funnel_7d || {};
        const src = r.source_layer || (f.source_layer) || 'uncalibrated';
        const insuf = r.insufficient_source ? '⚠源不足' : '';
        return '<tr>' +
        '<td>' + esc(r.strategy_title || r.strategy_name || r.strategy_key) + '</td>' +
        '<td>' + esc(r.symbol) + ' / ' + esc(r.timeframe) + '</td>' +
        '<td>' + esc(r.grade) + '</td>' +
        '<td>' + (r.can_open ? '<span class="ok">可开仓</span>' : '<span class="warn">暂停</span>') + '</td>' +
        '<td>' + esc(r.mechanism_family || 'other') + '</td>' +
        '<td>' + esc(src) + (insuf ? (' <span class="warn">' + insuf + '</span>') : '') + '</td>' +
        '<td>' + esc(disp(r.weekly_opens_low)) + ' - ' + esc(disp(r.weekly_opens_high)) +
          (r.weekly_opens_expected != null ? ('（期望' + r.weekly_opens_expected + '）') : '') + '</td>' +
        '<td>' + esc(disp(f.signals,'?')) + '/' + esc(disp(f.attempts,'?')) + '/' + esc(disp(f.fills,'?')) + '</td>' +
        '<td>' + esc(disp(r.opens_7d_actual)) + '</td>' +
        '</tr>';
      }).join('');
      document.getElementById('rows').innerHTML = body || '<tr><td colspan="9" class="muted">无分策略数据</td></tr>';
      document.getElementById('assumptions').innerHTML =
        (rep.key_assumptions || []).map(x => '<li>' + esc(x) + '</li>').join('') || '<li class="muted">无</li>';
      document.getElementById('risks').innerHTML =
        (rep.risk_warnings || []).map(x => '<li>' + esc(x) + '</li>').join('') || '<li class="muted">无</li>';
      const calibRows = ((rep.calibration || {}).rows || []).slice().reverse();
      document.getElementById('calib').innerHTML = (calibRows.map(r =>
        '<tr><td>' + esc(r.generated_at) + '</td><td>' + esc(disp(r.expected_weekly_fills)) +
        '</td><td>' + esc(disp(r.realized_weekly_fills)) + '</td><td>' + esc(disp(r.error)) +
        '</td><td>' + esc(r.method || '') + '</td></tr>'
      ).join('')) || '<tr><td colspan="5" class="muted">暂无校准行</td></tr>';
    }
    function renderHistory(rows) {
      const html = (rows || []).map(r => {
        const o = r.overall || {};
        const ai = r.ai_status || {};
        return '<tr>' +
          '<td>' + esc(r.generated_at) + '</td>' +
          '<td>' + esc(disp(o.daily_opens_expected)) + '</td>' +
          '<td>' + esc(disp(o.weekly_opens_expected)) + '</td>' +
          '<td>' + esc(disp(r.active_strategy_count)) + '</td>' +
          '<td>' + (ai.all_ok ? '<span class="ok">OK</span>' : '<span class="warn">部分失败</span>') + '</td>' +
          '</tr>';
      }).join('');
      document.getElementById('history').innerHTML = html || '<tr><td colspan="5" class="muted">暂无历史</td></tr>';
    }
    async function loadAll() {
      try {
        const [a, b, c] = await Promise.all([
          fetch('/api/forecast/latest', { credentials: 'same-origin' }).then(r => r.json()),
          fetch('/api/forecast/history?limit=20', { credentials: 'same-origin' }).then(r => r.json()),
          fetch('/api/forecast/calibration', { credentials: 'same-origin' }).then(r => r.json()).catch(() => ({})),
        ]);
        const rep = a.report || a || {};
        if (c && c.calibration) rep.calibration = c.calibration;
        renderLatest(rep);
        renderHistory(b.items || []);
      } catch (e) {
        document.getElementById('status').textContent = '加载失败：' + e;
      }
    }
    async function runForecast() {
      const btn = document.getElementById('btnRun');
      btn.disabled = true;
      document.getElementById('status').textContent = '正在运行统计基线+三AI解释，约需1-2分钟…';
      try {
        const res = await fetch('/api/forecast/run', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ push_wx: true }),
        });
        const data = await res.json();
        if (!res.ok || data.status === 'error') {
          throw new Error(data.message || data.error || ('HTTP ' + res.status));
        }
        renderLatest(data.report || {});
        await loadAll();
        document.getElementById('status').textContent =
          '运行完成 · Wx推送: ' + ((data.wx && data.wx.ok) ? '成功' : JSON.stringify(data.wx || {}));
      } catch (e) {
        document.getElementById('status').textContent = '运行失败：' + e;
      } finally {
        btn.disabled = false;
      }
    }
    loadAll();
  </script>
</body>
</html>
